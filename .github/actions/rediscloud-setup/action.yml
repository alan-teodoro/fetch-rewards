name: Redis Cloud Terraform setup
description: Set up Terraform, validate access and render the configuration.
inputs:
  config-path:
    required: true
    description: Versioned JSON configuration.
  render-mode:
    default: skip
    description: apply, destroy or skip.
  agent-memory-key:
    default: ""
    description: Optional selective destroy key.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install configuration dependencies
      shell: bash
      run: python3 -m pip install -r requirements.txt
    - name: Validate versioned config
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail
        python3 scripts/rediscloud_config.py validate --workflow --config "${CONFIG_PATH}"
    - name: Validate Redis Cloud credentials
      shell: bash
      run: python3 scripts/rediscloud_auth_check.py
    - name: Render configuration
      if: inputs.render-mode != 'skip'
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        RENDER_MODE: ${{ inputs.render-mode }}
        AGENT_MEMORY_KEY: ${{ inputs.agent-memory-key }}
      run: |
        set -euo pipefail
        umask 077
        mkdir -p "$(dirname "${RENDER_DIR}")"
        if [ "${RENDER_MODE}" = "destroy" ]; then
          python3 scripts/rediscloud_config.py render-destroy --config "${CONFIG_PATH}" \
            --agent-memory-key "${AGENT_MEMORY_KEY}" --out-dir "${RENDER_DIR}" > "${RENDER_DIR}.summary.json"
        else
          python3 scripts/rediscloud_config.py render --config "${CONFIG_PATH}" \
            --out-dir "${RENDER_DIR}" > "${RENDER_DIR}.summary.json"
        fi
    - name: Set up pinned Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false
