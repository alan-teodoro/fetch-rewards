name: Terraform Validate

on:
  workflow_dispatch:
    inputs:
      provider_readiness:
        description: Run protected Agent Memory acceptance tests against the existing isolated QA database.
        type: boolean
        default: false
      provider_candidate:
        description: Exact 40-character provider commit for the optional acceptance test.
        type: string
        default: ''
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REDISCLOUD_PROVIDER_SOURCE: ${{ vars.REDISCLOUD_PROVIDER_SOURCE || 'branch' }}
  REDISCLOUD_PROVIDER_REPOSITORY: RedisLabs/terraform-provider-rediscloud
  REDISCLOUD_PROVIDER_REF: ${{ vars.REDISCLOUD_PROVIDER_REF || 'alan/agent-memory-terraform-provider' }}
  PROVIDER_DEV_OVERRIDE_DIR: ${{ vars.REDISCLOUD_PROVIDER_DEV_OVERRIDE_DIR }}
  PROVIDER_BUILD_PATH: .provider/terraform-provider-rediscloud

jobs:
  readiness-review:
    name: Review isolated provider acceptance test
    if: github.event_name == 'workflow_dispatch' && inputs.provider_readiness
    runs-on: ubuntu-latest
    steps:
      - name: Describe the mutations before approval
        env:
          CANDIDATE: ${{ inputs.provider_candidate }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || { echo 'An exact provider commit is required.' >&2; exit 1; }
          {
            echo '## Provider production-readiness acceptance test'
            echo "Provider commit: \`$CANDIDATE\`"
            echo 'Uses only the existing fetch-provider-readiness / agent-memory-readiness-db QA database.'
            echo 'Creates one uniquely named tfacc Agent Memory store and runtime key.'
            echo 'Verifies import, updates TTL, introduces and reconciles external drift, replaces the runtime key, checks no-op, and destroys its own store/key.'
            echo 'Then creates three temporary runtime keys on the two configured QA stores to verify SDK authentication, cross-store denial and revoked-key rejection. These keys are removed afterward; no session or long-term memories are written.'
            echo 'The QA subscription/database and existing agents are retained. Demo resources are not used.'
            echo 'This is a test sequence rather than a saved Terraform plan; approve only if these QA mutations are intended.'
            echo 'The harness owns cleanup. If the runner is interrupted, reconcile the tfacc store before retrying.'
          } >> "$GITHUB_STEP_SUMMARY"

  provider-readiness:
    name: Approve isolated Agent Memory acceptance test
    needs: readiness-review
    environment: dev
    timeout-minutes: 50
    runs-on: ubuntu-latest
    env:
      REDISCLOUD_ACCESS_KEY: ${{ secrets.REDISCLOUD_ACCESS_KEY }}
      REDISCLOUD_SECRET_KEY: ${{ secrets.REDISCLOUD_SECRET_KEY }}
      REDISCLOUD_URL: ${{ secrets.REDISCLOUD_URL || vars.REDISCLOUD_URL }}
      TF_LOG: ''
      TF_ACC: '1'
      AGENT_MEMORY_TEST_PREFIX: tfacc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: RedisLabs/terraform-provider-rediscloud
          ref: ${{ inputs.provider_candidate }}
          path: .provider/readiness
          token: ${{ secrets.REDISCLOUD_PROVIDER_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .provider/readiness/go.mod
          cache-dependency-path: .provider/readiness/go.sum
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - name: Resolve the existing QA database
        id: qa
        run: |
          python3 scripts/rediscloud_lookup.py \
            --subscription-name fetch-provider-readiness \
            --database-name agent-memory-readiness-db
      - name: Run real lifecycle, import, drift and key replacement checks
        working-directory: .provider/readiness
        env:
          AGENT_MEMORY_TEST_DATABASE_ID: ${{ steps.qa.outputs.database_id }}
        run: |
          set -euo pipefail
          test -n "$AGENT_MEMORY_TEST_DATABASE_ID"
          export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          go test ./provider/agentmemory -v \
            -run '^TestAccAgentMemory_ProductionReadiness_CRUDI$' \
            -count=1 -parallel=1 -timeout=40m
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the official data-plane SDK
        run: python -m pip install 'redis-agent-memory==0.4.1'
      - name: Check real authentication, store isolation and key revocation
        env:
          AGENT_MEMORY_TEST_DATABASE_ID: ${{ steps.qa.outputs.database_id }}
        run: python scripts/agent_memory_auth_probe.py

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - stacks/state-backend
          - stacks/subscription
          - stacks/database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate

  config-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test config and workflow lifecycle behavior
        run: python3 -m unittest discover -s tests -v

      - name: Validate subscription configs
        run: |
          found=false
          for config in configs/*/subscriptions/*.json; do
            if [ ! -f "${config}" ]; then
              continue
            fi
            found=true
            python3 scripts/rediscloud_config.py validate --config "${config}"
          done

          if [ "${found}" != "true" ]; then
            echo "No subscription config files found." >&2
            exit 1
          fi

  agent-memory-validate:
    runs-on: ${{ vars.REDISCLOUD_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Redis Cloud provider branch
        if: env.REDISCLOUD_PROVIDER_SOURCE == 'branch'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REDISCLOUD_PROVIDER_REPOSITORY }}
          ref: ${{ env.REDISCLOUD_PROVIDER_REF }}
          path: ${{ env.PROVIDER_BUILD_PATH }}
          token: ${{ secrets.REDISCLOUD_PROVIDER_CHECKOUT_TOKEN || github.token }}

      - name: Set up Go for provider build
        if: env.REDISCLOUD_PROVIDER_SOURCE == 'branch'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.PROVIDER_BUILD_PATH }}/go.mod
          cache-dependency-path: ${{ env.PROVIDER_BUILD_PATH }}/go.sum

      - name: Build Redis Cloud provider branch
        if: env.REDISCLOUD_PROVIDER_SOURCE == 'branch'
        run: |
          set -euo pipefail

          install_dir="${RUNNER_TEMP}/rediscloud-provider-dev"
          provider_binary="${install_dir}/terraform-provider-rediscloud"

          mkdir -p "${install_dir}"
          (
            cd "${PROVIDER_BUILD_PATH}"
            go build -o "${provider_binary}" .
          )
          chmod +x "${provider_binary}"

          cat > "${RUNNER_TEMP}/terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "RedisLabs/rediscloud" = "${install_dir}"
            }

            direct {}
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=${RUNNER_TEMP}/terraformrc" >> "$GITHUB_ENV"

      - name: Configure legacy Terraform provider override
        if: env.REDISCLOUD_PROVIDER_SOURCE == 'registry' && env.PROVIDER_DEV_OVERRIDE_DIR != ''
        run: |
          cat > "${RUNNER_TEMP}/terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "RedisLabs/rediscloud" = "${PROVIDER_DEV_OVERRIDE_DIR}"
            }

            direct {}
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=${RUNNER_TEMP}/terraformrc" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: stacks/agent-memory
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: stacks/agent-memory
        run: terraform validate
