name: Terraform Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - stacks/state-backend
          - stacks/subscription
          - stacks/database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate

  config-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate subscription configs
        run: |
          found=false
          for config in configs/*/subscriptions/*.json; do
            if [ ! -f "${config}" ]; then
              continue
            fi
            found=true
            python3 scripts/rediscloud_config.py validate --config "${config}"
          done

          if [ "${found}" != "true" ]; then
            echo "No subscription config files found." >&2
            exit 1
          fi

  agent-memory-validate:
    if: ${{ vars.REDISCLOUD_PROVIDER_DEV_OVERRIDE_DIR != '' }}
    runs-on: ${{ vars.REDISCLOUD_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform provider override
        run: |
          cat > "${RUNNER_TEMP}/terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "RedisLabs/rediscloud" = "${{ vars.REDISCLOUD_PROVIDER_DEV_OVERRIDE_DIR }}"
            }

            direct {}
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=${RUNNER_TEMP}/terraformrc" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: stacks/agent-memory
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: stacks/agent-memory
        run: terraform validate
