name: Terraform Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - stacks/state-backend
          - stacks/subscription
          - stacks/database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate

      - name: Verify state bucket bootstrap is repeatable without cloud access
        if: matrix.stack == 'stacks/state-backend'
        run: |
          cp stacks/state-backend/.terraform.lock.hcl modules/terraform_state_backend/.terraform.lock.hcl
          terraform -chdir=modules/terraform_state_backend init -backend=false -input=false
          terraform -chdir=modules/terraform_state_backend test -no-color

  config-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install configuration dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Test config and workflow lifecycle behavior
        run: python3 -m unittest discover -s tests -v

      - name: Validate subscription configs
        run: |
          found=false
          for config in configs/*/subscriptions/*.json; do
            if [ ! -f "${config}" ]; then
              continue
            fi
            found=true
            python3 scripts/rediscloud_config.py validate --config "${config}"
          done

          if [ "${found}" != "true" ]; then
            echo "No subscription config files found." >&2
            exit 1
          fi

  deployment-validate:
    runs-on: ${{ vars.REDISCLOUD_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false

      - name: Terraform init
        working-directory: stacks/deployment
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: stacks/deployment
        run: terraform validate

      - name: Set up Python for the Terraform contract test
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify native deployment dependencies and removals
        env:
          TEST_REGISTRY_PROVIDER: "1"
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -p 'test_terraform_contract.py' -v
