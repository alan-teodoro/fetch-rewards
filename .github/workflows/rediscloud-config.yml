name: Redis Cloud Config Apply

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the subscription config JSON file.
        required: true
        type: string
        default: configs/fetch-rewards/subscriptions/demo-ai-us-east-1.json
      operation:
        description: Run Terraform plan only or plan and apply.
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      rediscloud_provider_source:
        description: Use the official Registry provider or build the Agent Memory provider from a branch.
        required: true
        type: choice
        options:
          - branch
          - registry
        default: branch
      rediscloud_provider_ref:
        description: Provider branch, tag, or commit used when rediscloud_provider_source is branch.
        required: true
        type: string
        default: alan/agent-memory-terraform-provider

permissions:
  contents: read
  id-token: write

concurrency:
  group: rediscloud-infrastructure
  cancel-in-progress: false

jobs:
  preview:
    if: inputs.operation == 'plan'
    uses: ./.github/workflows/rediscloud-phase.yml
    secrets: inherit
    with:
      phase: preview
      config_path: ${{ inputs.config_path }}
      provider_source: ${{ inputs.rediscloud_provider_source }}
      provider_ref: ${{ inputs.rediscloud_provider_ref }}
  infrastructure:
    name: Review and deploy configuration
    if: inputs.operation == 'apply'
    uses: ./.github/workflows/rediscloud-phase.yml
    secrets: inherit
    with:
      phase: rollout
      apply: true
      config_path: ${{ inputs.config_path }}
      provider_source: ${{ inputs.rediscloud_provider_source }}
      provider_ref: ${{ inputs.rediscloud_provider_ref }}
