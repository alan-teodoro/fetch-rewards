name: Redis Cloud Config Apply

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the subscription config JSON file.
        required: true
        type: string
        default: configs/fetch-rewards/subscriptions/demo-ai-us-east-1.json
      operation:
        description: Review the full configuration, or apply its saved Terraform plan.
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: rediscloud-infrastructure
  cancel-in-progress: false

jobs:
  preview:
    if: inputs.operation == 'plan'
    uses: ./.github/workflows/rediscloud-phase.yml
    secrets: inherit
    with:
      phase: preview
      config_path: ${{ inputs.config_path }}
  infrastructure:
    name: Review and deploy configuration
    if: inputs.operation == 'apply'
    uses: ./.github/workflows/rediscloud-phase.yml
    secrets: inherit
    with:
      phase: rollout
      apply: true
      config_path: ${{ inputs.config_path }}
