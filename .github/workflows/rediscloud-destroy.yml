name: Redis Cloud Config Destroy

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the subscription config JSON file.
        required: true
        type: string
        default: configs/fetch-rewards/subscriptions/demo-ai-us-east-1.json
      confirm_destroy:
        description: Confirm destroy of the selected Agent Memory or all managed resources.
        required: true
        type: boolean
        default: false
      agent_memory_key:
        description: Delete only this Agent Memory config key; other pending changes block selective deletion. Leave empty for full destroy.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: rediscloud-infrastructure
  cancel-in-progress: false

jobs:
  validate_request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install configuration dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate destroy confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
          CONFIG_PATH: ${{ inputs.config_path }}
          AGENT_MEMORY_KEY: ${{ inputs.agent_memory_key }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM_DESTROY}" != "true" ]; then
            echo "::error title=Destroy confirmation required::Set confirm_destroy to true before running this workflow."
            exit 1
          fi

          python3 scripts/rediscloud_config.py validate-destroy --workflow \
            --config "${CONFIG_PATH}" \
            --agent-memory-key "${AGENT_MEMORY_KEY}"

  destroy:
    needs: validate_request
    uses: ./.github/workflows/rediscloud-phase.yml
    secrets: inherit
    with:
      phase: destroy
      apply: true
      config_path: ${{ inputs.config_path }}
      agent_memory_key: ${{ inputs.agent_memory_key }}
