name: Redis Cloud Config Destroy

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the subscription config JSON file.
        required: true
        type: string
        default: configs/fetch-rewards/subscriptions/demo-ai-us-east-1.json
      confirm_destroy:
        description: Confirm destroy of all managed resources in this config.
        required: true
        type: boolean
        default: false
      rediscloud_provider_source:
        description: Use the official Registry provider or build the Agent Memory provider from a branch.
        required: true
        type: choice
        options:
          - branch
          - registry
        default: branch
      rediscloud_provider_ref:
        description: Provider branch, tag, or commit used when rediscloud_provider_source is branch.
        required: true
        type: string
        default: alan/agent-memory-terraform-provider

permissions:
  contents: read
  id-token: write

concurrency:
  group: rediscloud-destroy-${{ inputs.config_path }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET_NAME: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION_NAME: ${{ vars.TF_STATE_REGION }}
  PROVIDER_DEV_OVERRIDE_DIR: ${{ vars.REDISCLOUD_PROVIDER_DEV_OVERRIDE_DIR }}
  REDISCLOUD_PROVIDER_REPOSITORY: RedisLabs/terraform-provider-rediscloud
  PROVIDER_BUILD_PATH: .provider/terraform-provider-rediscloud
  AGENT_MEMORY_LLM_API_KEY: ${{ secrets.AGENT_MEMORY_LLM_API_KEY }}
  AGENT_MEMORY_EMBEDDING_API_KEY: ${{ secrets.AGENT_MEMORY_EMBEDDING_API_KEY }}

jobs:
  validate_request:
    runs-on: ubuntu-latest

    steps:
      - name: Validate destroy confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "${CONFIRM_DESTROY}" != "true" ]; then
            echo "::error title=Destroy confirmation required::Set confirm_destroy to true before running this workflow."
            exit 1
          fi

  approve_destroy:
    needs: validate_request
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Confirm config destroy request
        run: |
          {
            echo "## Redis Cloud config destroy approval"
            echo
            echo "- Config: \`${{ inputs.config_path }}\`"
            echo "- Confirm destroy: \`${{ inputs.confirm_destroy }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    needs: approve_destroy
    runs-on: ${{ vars.REDISCLOUD_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Redis Cloud provider branch
        if: inputs.rediscloud_provider_source == 'branch'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REDISCLOUD_PROVIDER_REPOSITORY }}
          ref: ${{ inputs.rediscloud_provider_ref }}
          path: ${{ env.PROVIDER_BUILD_PATH }}
          token: ${{ secrets.REDISCLOUD_PROVIDER_CHECKOUT_TOKEN || github.token }}

      - name: Set up Go for provider build
        if: inputs.rediscloud_provider_source == 'branch'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.PROVIDER_BUILD_PATH }}/go.mod
          cache-dependency-path: ${{ env.PROVIDER_BUILD_PATH }}/go.sum

      - name: Build Redis Cloud provider branch
        if: inputs.rediscloud_provider_source == 'branch'
        run: |
          set -euo pipefail

          install_dir="${RUNNER_TEMP}/rediscloud-provider-dev"
          provider_binary="${install_dir}/terraform-provider-rediscloud"

          mkdir -p "${install_dir}"
          (
            cd "${PROVIDER_BUILD_PATH}"
            echo "Building Redis Cloud provider from commit $(git rev-parse HEAD)"
            echo "Using $(go list -m github.com/RedisLabs/rediscloud-go-api)"
            go build -o "${provider_binary}" .
          )
          chmod +x "${provider_binary}"

          cat > "${RUNNER_TEMP}/terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "RedisLabs/rediscloud" = "${install_dir}"
            }

            direct {}
          }
          EOF

          echo "TF_CLI_CONFIG_FILE=${RUNNER_TEMP}/terraformrc" >> "$GITHUB_ENV"

      - name: Validate config path
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          case "${CONFIG_PATH}" in
            configs/fetch-rewards/subscriptions/*.json) ;;
            *)
              echo "config_path must match configs/fetch-rewards/subscriptions/*.json" >&2
              exit 1
              ;;
          esac

          if [ ! -f "${CONFIG_PATH}" ]; then
            echo "Config file does not exist: ${CONFIG_PATH}" >&2
            exit 1
          fi

      - name: Configure Redis Cloud credentials
        env:
          REDISCLOUD_ACCESS_KEY_VALUE: ${{ secrets.REDISCLOUD_ACCESS_KEY }}
          REDISCLOUD_SECRET_KEY_VALUE: ${{ secrets.REDISCLOUD_SECRET_KEY }}
          REDISCLOUD_URL_SECRET: ${{ secrets.REDISCLOUD_URL }}
          REDISCLOUD_URL_VAR: ${{ vars.REDISCLOUD_URL }}
        run: |
          if [ -z "${REDISCLOUD_ACCESS_KEY_VALUE}" ] || [ -z "${REDISCLOUD_SECRET_KEY_VALUE}" ]; then
            echo "REDISCLOUD_ACCESS_KEY and REDISCLOUD_SECRET_KEY must be configured." >&2
            exit 1
          fi

          {
            echo "REDISCLOUD_ACCESS_KEY=${REDISCLOUD_ACCESS_KEY_VALUE}"
            echo "REDISCLOUD_SECRET_KEY=${REDISCLOUD_SECRET_KEY_VALUE}"
            rediscloud_url="${REDISCLOUD_URL_SECRET:-${REDISCLOUD_URL_VAR:-}}"
            if [ -n "${rediscloud_url}" ]; then
              echo "REDISCLOUD_URL=${rediscloud_url}"
            fi
          } >> "$GITHUB_ENV"

      - name: Validate Redis Cloud credentials
        run: python3 scripts/rediscloud_auth_check.py

      - name: Validate and render config
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          RENDER_DIR: .generated/rediscloud/${{ github.run_id }}
        run: |
          mkdir -p "$(dirname "${RENDER_DIR}")"

          python3 scripts/rediscloud_config.py validate --config "${CONFIG_PATH}"
          python3 scripts/rediscloud_config.py render \
            --config "${CONFIG_PATH}" \
            --out-dir "${RENDER_DIR}" > "${RENDER_DIR}.summary.json"

          {
            echo "## Redis Cloud config"
            echo
            jq -r '
              "- Customer: `\(.customer)`",
              "- Environment: `\(.environment)`",
              "- Subscription key: `\(.subscription_key)`",
              "- Subscription: `\(.subscription.name)` (`\(.subscription.mode)`)",
              "- Databases: `\(.databases | length)`",
              "- Agent Memory stores: `\(.agent_memory_stores | length)`"
            ' "${RENDER_DIR}/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Terraform provider override
        if: inputs.rediscloud_provider_source == 'registry'
        run: |
          if [ -n "${PROVIDER_DEV_OVERRIDE_DIR}" ]; then
            cat > "${RUNNER_TEMP}/terraformrc" <<EOF
          provider_installation {
            dev_overrides {
              "RedisLabs/rediscloud" = "${PROVIDER_DEV_OVERRIDE_DIR}"
            }

            direct {}
          }
          EOF
            echo "TF_CLI_CONFIG_FILE=${RUNNER_TEMP}/terraformrc" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials for Terraform state
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.TF_STATE_REGION_NAME }}

      - name: Validate Terraform state prefix access
        env:
          RENDER_DIR: .generated/rediscloud/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${TF_STATE_BUCKET_NAME:-}" ]; then
            echo "TF_STATE_BUCKET repository variable must be configured." >&2
            exit 1
          fi

          manifest="${RENDER_DIR}/manifest.json"
          while read -r state_key; do
            aws s3api head-object \
              --bucket "${TF_STATE_BUCKET_NAME}" \
              --key "${state_key}" >/dev/null || true
          done < <(
            jq -r '
              [
                (.agent_memory_stores[]? | select(.mode == "managed") | .state_key),
                (.databases[]? | select(.mode == "managed") | .state_key),
                (if .subscription.mode == "managed" then .subscription.state_key else empty end)
              ] | .[]
            ' "${manifest}"
          )

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Destroy rendered config
        env:
          RENDER_DIR: .generated/rediscloud/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${TF_STATE_BUCKET_NAME:-}" ] || [ -z "${TF_STATE_REGION_NAME:-}" ]; then
            echo "TF_STATE_BUCKET and TF_STATE_REGION repository variables must be configured." >&2
            exit 1
          fi

          manifest="${RENDER_DIR}/manifest.json"

          {
            echo "## Execution mode"
            echo
            echo "- Destroying saved Terraform states by dependency phase: Agent Memory, databases, then subscription."
            echo "- Only managed resources described by this config file are targeted."
          } >> "$GITHUB_STEP_SUMMARY"

          prepare_backend() {
            local stack_dir="$1"
            local state_key="$2"

            cat > "${stack_dir}/backend.generated.tf" <<'EOF'
          terraform {
            backend "s3" {
              use_lockfile = true
            }
          }
          EOF

            terraform -chdir="${stack_dir}" init -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
              -backend-config="region=${TF_STATE_REGION_NAME}" \
              -backend-config="key=${state_key}"
          }

          write_destroy_summary() {
            local title="$1"
            local plan_json="$2"

            {
              echo "## Terraform destroy plan: ${title}"
              echo
              jq -r '
                def action:
                  if (.change.actions | index("delete") and index("create")) then "replace"
                  else (.change.actions | join(","))
                  end;
                [ .resource_changes[]? | select(.change.actions != ["no-op"]) | action ] as $actions |
                "- Create: \($actions | map(select(. == "create")) | length)",
                "- Update: \($actions | map(select(. == "update")) | length)",
                "- Replace: \($actions | map(select(. == "replace")) | length)",
                "- Delete: \($actions | map(select(. == "delete")) | length)"
              ' "${plan_json}"
              echo
              echo "| Action | Resource |"
              echo "| --- | --- |"
              jq -r '
                def action:
                  if (.change.actions | index("delete") and index("create")) then "replace"
                  else (.change.actions | join(","))
                  end;
                [ .resource_changes[]? | select(.change.actions != ["no-op"]) | "| `\(action)` | `\(.address)` |" ] |
                if length == 0 then "| `no-op` | No resource changes |" else .[] end
              ' "${plan_json}"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          destroy_stack() {
            local title="$1"
            local stack_dir="$2"
            local state_key="$3"
            local tfvars_path="$4"
            local plan_name="$5"

            prepare_backend "${stack_dir}" "${state_key}"

            terraform -chdir="${stack_dir}" plan \
              -destroy \
              -input=false \
              -var-file="${GITHUB_WORKSPACE}/${tfvars_path}" \
              -out="${plan_name}"

            terraform -chdir="${stack_dir}" show -json "${plan_name}" > "${stack_dir}/${plan_name}.json"
            write_destroy_summary "${title}" "${stack_dir}/${plan_name}.json"

            echo "Destroying ${title}"
            terraform -chdir="${stack_dir}" apply -input=false -auto-approve "${plan_name}"
          }

          while read -r store; do
            destroy_stack \
              "agent-memory $(jq -r '.name' <<<"${store}")" \
              "stacks/agent-memory" \
              "$(jq -r '.state_key' <<<"${store}")" \
              "$(jq -r '.tfvars_path' <<<"${store}")" \
              "agent-memory-$(jq -r '.key' <<<"${store}")-destroy.tfplan"
          done < <(jq -c '.agent_memory_stores[] | select(.mode == "managed")' "${manifest}")

          while read -r database; do
            destroy_stack \
              "database $(jq -r '.name' <<<"${database}")" \
              "stacks/database" \
              "$(jq -r '.state_key' <<<"${database}")" \
              "$(jq -r '.tfvars_path' <<<"${database}")" \
              "database-$(jq -r '.key' <<<"${database}")-destroy.tfplan"
          done < <(jq -c '.databases[] | select(.mode == "managed")' "${manifest}")

          subscription_mode="$(jq -r '.subscription.mode' "${manifest}")"
          if [ "${subscription_mode}" = "managed" ]; then
            destroy_stack \
              "subscription $(jq -r '.subscription.name' "${manifest}")" \
              "stacks/subscription" \
              "$(jq -r '.subscription.state_key' "${manifest}")" \
              "$(jq -r '.subscription.tfvars_path' "${manifest}")" \
              "subscription-destroy.tfplan"
          fi

      - name: Write output summary
        env:
          RENDER_DIR: .generated/rediscloud/${{ github.run_id }}
        run: |
          {
            echo "## Runtime notes"
            echo
            echo "- Destroy order is Agent Memory, databases, then subscription."
            echo "- Rendered manifest: \`${RENDER_DIR}/manifest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
