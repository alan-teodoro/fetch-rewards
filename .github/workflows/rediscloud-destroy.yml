name: Redis Cloud Config Destroy

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the subscription config JSON file.
        required: true
        type: string
        default: configs/fetch-rewards/subscriptions/demo-ai-us-east-1.json
      confirm_destroy:
        description: Confirm destroy of the selected Agent Memory or all managed resources.
        required: true
        type: boolean
        default: false
      agent_memory_key:
        description: Delete only this Agent Memory config key. Leave empty to destroy all managed resources.
        required: false
        type: string
        default: ""
      rediscloud_provider_source:
        description: Use the official Registry provider or build the Agent Memory provider from a branch.
        required: true
        type: choice
        options:
          - branch
          - registry
        default: branch
      rediscloud_provider_ref:
        description: Provider branch, tag, or commit used when rediscloud_provider_source is branch.
        required: true
        type: string
        default: 39d6752e915a71c7b58f7ee4b0f63304be3528df

permissions:
  contents: read
  id-token: write

concurrency:
  group: rediscloud-infrastructure
  cancel-in-progress: false

jobs:
  validate_request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate destroy confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
          CONFIG_PATH: ${{ inputs.config_path }}
          AGENT_MEMORY_KEY: ${{ inputs.agent_memory_key }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM_DESTROY}" != "true" ]; then
            echo "::error title=Destroy confirmation required::Set confirm_destroy to true before running this workflow."
            exit 1
          fi

          case "${CONFIG_PATH}" in
            configs/fetch-rewards/subscriptions/*.json) ;;
            *) echo "Invalid subscription config path." >&2; exit 1 ;;
          esac
          python3 scripts/rediscloud_config.py validate-destroy \
            --config "${CONFIG_PATH}" \
            --agent-memory-key "${AGENT_MEMORY_KEY}"

  destroy:
    needs: validate_request
    uses: ./.github/workflows/rediscloud-phase.yml
    secrets: inherit
    with:
      phase: destroy
      apply: true
      config_path: ${{ inputs.config_path }}
      provider_source: ${{ inputs.rediscloud_provider_source }}
      provider_ref: ${{ inputs.rediscloud_provider_ref }}
      agent_memory_key: ${{ inputs.agent_memory_key }}
