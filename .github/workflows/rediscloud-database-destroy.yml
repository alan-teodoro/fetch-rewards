name: Redis Cloud Database Destroy

on:
  workflow_dispatch:
    inputs:
      subscription_name:
        description: Redis Cloud subscription name.
        required: true
        type: string
      database_name:
        description: Redis Cloud database name.
        required: true
        type: string
      confirm_destroy:
        description: Must be true to destroy the database.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: rediscloud-database-destroy-${{ inputs.subscription_name }}-${{ inputs.database_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  REDISCLOUD_ACCESS_KEY: ${{ secrets.REDISCLOUD_ACCESS_KEY }}
  REDISCLOUD_SECRET_KEY: ${{ secrets.REDISCLOUD_SECRET_KEY }}
  TF_STATE_BUCKET_NAME: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION_NAME: ${{ vars.TF_STATE_REGION }}

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize resource names
        id: names
        env:
          RAW_SUBSCRIPTION_NAME: ${{ inputs.subscription_name }}
          RAW_DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          subscription_name="$(
            python3 scripts/normalize_rediscloud_name.py \
              --field subscription_name \
              --value "${RAW_SUBSCRIPTION_NAME}"
          )"

          database_name="$(
            python3 scripts/normalize_rediscloud_name.py \
              --field database_name \
              --value "${RAW_DATABASE_NAME}"
          )"

          echo "subscription_name=${subscription_name}" >> "$GITHUB_OUTPUT"
          echo "database_name=${database_name}" >> "$GITHUB_OUTPUT"

      - name: Validate destroy confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "${CONFIRM_DESTROY}" != "true" ]; then
            echo "confirm_destroy must be true to run this workflow."
            exit 1
          fi

      - name: Validate Redis Cloud credentials
        run: python3 scripts/rediscloud_auth_check.py

      - name: Configure AWS credentials for Terraform state
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.TF_STATE_REGION_NAME }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write database tfvars
        env:
          SUBSCRIPTION_NAME: ${{ steps.names.outputs.subscription_name }}
          DATABASE_NAME: ${{ steps.names.outputs.database_name }}
        run: |
          jq -n \
            --arg subscription_name "${SUBSCRIPTION_NAME}" \
            --arg database_name "${DATABASE_NAME}" \
            '{
              subscription_name: $subscription_name,
              database_name: $database_name
            }' > stacks/database/request.auto.tfvars.json

      - name: Prepare database backend
        working-directory: stacks/database
        run: |
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {' \
            '    use_lockfile = true' \
            '  }' \
            '}' > backend.generated.tf

          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="region=${TF_STATE_REGION_NAME}" \
            -backend-config="key=databases/${{ steps.names.outputs.subscription_name }}/${{ steps.names.outputs.database_name }}.tfstate"

      - name: Destroy database
        working-directory: stacks/database
        run: terraform destroy -input=false -auto-approve

      - name: Write summary
        run: |
          {
            echo "## Redis Cloud database destroy"
            echo
            echo "- Requested subscription: \`${{ inputs.subscription_name }}\`"
            echo "- Normalized subscription: \`${{ steps.names.outputs.subscription_name }}\`"
            echo "- Requested database: \`${{ inputs.database_name }}\`"
            echo "- Normalized database: \`${{ steps.names.outputs.database_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
