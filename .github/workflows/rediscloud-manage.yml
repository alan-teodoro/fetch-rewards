name: Redis Cloud Manage

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply changes or destroy managed resources.
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      github_environment:
        description: GitHub environment used for OIDC trust and approvals.
        required: true
        type: choice
        options:
          - prod
        default: prod
      subscription_mode:
        description: Manage the subscription stack or use an existing Redis Cloud subscription.
        required: true
        type: choice
        options:
          - create-or-update-subscription
          - existing-subscription
        default: create-or-update-subscription
      destroy_scope:
        description: Destroy only the database state or the database and managed subscription state.
        required: true
        type: choice
        options:
          - database-only
          - database-and-subscription
        default: database-only
      subscription_name:
        description: Redis Cloud subscription name.
        required: true
        type: string
      database_name:
        description: Redis Cloud database name.
        required: true
        type: string
      subscription_config_json:
        description: JSON object with subscription creation/update parameters.
        required: true
        type: string
        default: '{"dataset_size_in_gb":1,"throughput_ops_per_second":5000,"region":"us-east-1","networking_deployment_cidr":"10.80.0.0/24","public_endpoint_access":false,"multiple_availability_zones":false,"preferred_availability_zones":[],"maintenance_windows":null,"tags":{}}'
      database_config_json:
        description: JSON object with database, ACL, alerts, and backup parameters.
        required: true
        type: string
        default: '{"dataset_size_in_gb":1,"throughput_ops_per_second":5000,"redis_version":"8.2","persistence_mode":"snapshot-every-6-hours","data_eviction":"allkeys-lru","replication":true,"enable_tls":true,"enable_default_user":false,"source_ips":null,"alerts":[],"remote_backup":null,"acl_rule_string":"+@all -@dangerous +info ~*","tags":{}}'
      confirm_destroy:
        description: Must be true when operation is destroy.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: rediscloud-${{ inputs.operation }}-${{ inputs.subscription_name }}-${{ inputs.database_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  REDISCLOUD_ACCESS_KEY: ${{ secrets.REDISCLOUD_ACCESS_KEY }}
  REDISCLOUD_SECRET_KEY: ${{ secrets.REDISCLOUD_SECRET_KEY }}
  TF_STATE_BUCKET_NAME: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_REGION_NAME: ${{ secrets.TF_STATE_REGION }}

jobs:
  manage:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Terraform state
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.TF_STATE_REGION_NAME }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate workflow inputs
        env:
          OPERATION: ${{ inputs.operation }}
          SUBSCRIPTION_MODE: ${{ inputs.subscription_mode }}
          DESTROY_SCOPE: ${{ inputs.destroy_scope }}
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
          SUBSCRIPTION_CONFIG_JSON: ${{ inputs.subscription_config_json }}
          DATABASE_CONFIG_JSON: ${{ inputs.database_config_json }}
        run: |
          if [ "${OPERATION}" = "destroy" ] && [ "${CONFIRM_DESTROY}" != "true" ]; then
            echo "confirm_destroy must be true when operation=destroy."
            exit 1
          fi

          if [ "${OPERATION}" = "destroy" ] && [ "${DESTROY_SCOPE}" = "database-and-subscription" ] && [ "${SUBSCRIPTION_MODE}" = "existing-subscription" ]; then
            echo "database-and-subscription destroy requires subscription_mode=create-or-update-subscription."
            exit 1
          fi

          printf '%s' "${SUBSCRIPTION_CONFIG_JSON}" | jq -e '
            type == "object" and
            ((.preferred_availability_zones // []) | type == "array") and
            ((.maintenance_windows // null) == null or ((.maintenance_windows // null) | type == "object")) and
            ((.tags // {}) | type == "object")
          ' >/dev/null

          printf '%s' "${DATABASE_CONFIG_JSON}" | jq -e '
            type == "object" and
            ((.source_ips // null) == null or ((.source_ips // null) | type == "array")) and
            ((.alerts // []) | type == "array") and
            ((.remote_backup // null) == null or ((.remote_backup // null) | type == "object")) and
            ((.tags // {}) | type == "object")
          ' >/dev/null

      - name: Write subscription tfvars
        if: inputs.subscription_mode == 'create-or-update-subscription'
        env:
          SUBSCRIPTION_NAME: ${{ inputs.subscription_name }}
          SUBSCRIPTION_CONFIG_JSON: ${{ inputs.subscription_config_json }}
        run: |
          printf '%s' "${SUBSCRIPTION_CONFIG_JSON}" | jq \
            --arg subscription_name "${SUBSCRIPTION_NAME}" \
            '{
              subscription_name: $subscription_name,
              dataset_size_in_gb: (.dataset_size_in_gb // 1),
              throughput_ops_per_second: (.throughput_ops_per_second // 5000),
              region: (.region // "us-east-1"),
              networking_deployment_cidr: (.networking_deployment_cidr // "10.80.0.0/24"),
              public_endpoint_access: (.public_endpoint_access // false),
              multiple_availability_zones: (.multiple_availability_zones // false),
              preferred_availability_zones: (.preferred_availability_zones // []),
              maintenance_windows: (.maintenance_windows // null),
              tags: (.tags // {})
            }' > stacks/subscription/request.auto.tfvars.json

      - name: Write database tfvars
        env:
          SUBSCRIPTION_NAME: ${{ inputs.subscription_name }}
          DATABASE_NAME: ${{ inputs.database_name }}
          DATABASE_CONFIG_JSON: ${{ inputs.database_config_json }}
        run: |
          printf '%s' "${DATABASE_CONFIG_JSON}" | jq \
            --arg subscription_name "${SUBSCRIPTION_NAME}" \
            --arg database_name "${DATABASE_NAME}" \
            '{
              subscription_name: $subscription_name,
              database_name: $database_name,
              dataset_size_in_gb: (.dataset_size_in_gb // 1),
              throughput_ops_per_second: (.throughput_ops_per_second // 5000),
              redis_version: (.redis_version // "8.2"),
              persistence_mode: (.persistence_mode // "snapshot-every-6-hours"),
              data_eviction: (.data_eviction // "allkeys-lru"),
              replication: (.replication // true),
              enable_tls: (.enable_tls // true),
              enable_default_user: (.enable_default_user // false),
              source_ips: (.source_ips // null),
              alerts: (.alerts // []),
              remote_backup: (.remote_backup // null),
              acl_rule_string: (.acl_rule_string // "+@all -@dangerous +info ~*"),
              tags: (.tags // {})
            }' > stacks/database/request.auto.tfvars.json

      - name: Prepare subscription backend
        if: inputs.subscription_mode == 'create-or-update-subscription'
        working-directory: stacks/subscription
        run: |
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {' \
            '    use_lockfile = true' \
            '  }' \
            '}' > backend.generated.tf

          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="region=${TF_STATE_REGION_NAME}" \
            -backend-config="key=subscriptions/${{ inputs.subscription_name }}.tfstate"

      - name: Prepare database backend
        working-directory: stacks/database
        run: |
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {' \
            '    use_lockfile = true' \
            '  }' \
            '}' > backend.generated.tf

          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="region=${TF_STATE_REGION_NAME}" \
            -backend-config="key=databases/${{ inputs.subscription_name }}/${{ inputs.database_name }}.tfstate"

      - name: Apply subscription
        if: inputs.operation == 'apply' && inputs.subscription_mode == 'create-or-update-subscription'
        working-directory: stacks/subscription
        run: terraform apply -input=false -auto-approve

      - name: Apply database
        if: inputs.operation == 'apply'
        working-directory: stacks/database
        run: terraform apply -input=false -auto-approve

      - name: Capture database outputs
        if: inputs.operation == 'apply'
        id: database_outputs
        working-directory: stacks/database
        run: |
          capture_output() {
            terraform output -raw "$1" 2>/dev/null || true
          }

          echo "database_id=$(capture_output database_id)" >> "$GITHUB_OUTPUT"
          echo "private_endpoint=$(capture_output private_endpoint)" >> "$GITHUB_OUTPUT"
          echo "public_endpoint=$(capture_output public_endpoint)" >> "$GITHUB_OUTPUT"
          echo "acl_user_name=$(capture_output acl_user_name)" >> "$GITHUB_OUTPUT"

      - name: Destroy database
        if: inputs.operation == 'destroy'
        working-directory: stacks/database
        run: terraform destroy -input=false -auto-approve

      - name: Destroy subscription
        if: inputs.operation == 'destroy' && inputs.destroy_scope == 'database-and-subscription'
        working-directory: stacks/subscription
        run: terraform destroy -input=false -auto-approve

      - name: Write summary
        run: |
          {
            echo "## Redis Cloud ${operation}"
            echo
            echo "- Operation: \`${operation}\`"
            echo "- Subscription mode: \`${subscription_mode}\`"
            echo "- Destroy scope: \`${destroy_scope}\`"
            echo "- Subscription: \`${subscription_name}\`"
            echo "- Database: \`${database_name}\`"
            if [ "${operation}" = "apply" ]; then
              echo "- Database ID: \`${database_id}\`"
              echo "- Private endpoint: \`${private_endpoint}\`"
              echo "- Public endpoint: \`${public_endpoint}\`"
              echo "- ACL user: \`${acl_user_name}\`"
              echo "- ACL password: sensitive Terraform output, not written to workflow summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          operation: ${{ inputs.operation }}
          subscription_mode: ${{ inputs.subscription_mode }}
          destroy_scope: ${{ inputs.destroy_scope }}
          subscription_name: ${{ inputs.subscription_name }}
          database_name: ${{ inputs.database_name }}
          database_id: ${{ steps.database_outputs.outputs.database_id }}
          private_endpoint: ${{ steps.database_outputs.outputs.private_endpoint }}
          public_endpoint: ${{ steps.database_outputs.outputs.public_endpoint }}
          acl_user_name: ${{ steps.database_outputs.outputs.acl_user_name }}
