name: Redis Cloud Manage

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply changes or destroy managed resources.
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      github_environment:
        description: GitHub environment used for OIDC trust and approvals.
        required: true
        type: choice
        options:
          - prod
        default: prod
      subscription_mode:
        description: Manage the subscription stack or use an existing Redis Cloud subscription.
        required: true
        type: choice
        options:
          - create-or-update-subscription
          - existing-subscription
        default: create-or-update-subscription
      destroy_scope:
        description: Destroy only the database state or the database and managed subscription state.
        required: true
        type: choice
        options:
          - database-only
          - database-and-subscription
        default: database-only
      subscription_name:
        description: Redis Cloud subscription name.
        required: true
        type: string
      subscription_dataset_size_in_gb:
        description: Subscription creation-plan dataset size in GB.
        required: true
        type: number
        default: 1
      subscription_throughput_ops_per_second:
        description: Subscription creation-plan throughput in ops/sec.
        required: true
        type: number
        default: 5000
      subscription_region:
        description: Redis Cloud subscription region.
        required: true
        type: string
        default: us-east-1
      subscription_networking_cidr:
        description: Redis Cloud deployment CIDR for the subscription.
        required: true
        type: string
        default: 10.80.0.0/24
      subscription_public_endpoint_access:
        description: Allow public endpoints for databases in this subscription.
        required: true
        type: boolean
        default: false
      subscription_multi_az:
        description: Deploy the subscription across multiple availability zones.
        required: true
        type: boolean
        default: false
      subscription_preferred_azs_json:
        description: JSON array of preferred availability zones.
        required: true
        type: string
        default: "[]"
      subscription_maintenance_windows_json:
        description: JSON maintenance window object, or null.
        required: true
        type: string
        default: "null"
      subscription_tags_json:
        description: JSON object of extra subscription resource tags.
        required: true
        type: string
        default: "{}"
      database_name:
        description: Redis Cloud database name.
        required: true
        type: string
      database_dataset_size_in_gb:
        description: Database dataset size in GB.
        required: true
        type: number
        default: 1
      database_throughput_ops_per_second:
        description: Database throughput in ops/sec.
        required: true
        type: number
        default: 5000
      database_redis_version:
        description: Redis version requested for the database.
        required: true
        type: string
        default: "8.2"
      database_persistence_mode:
        description: Database persistence mode.
        required: true
        type: choice
        options:
          - none
          - aof-every-1-second
          - aof-every-write
          - snapshot-every-1-hour
          - snapshot-every-6-hours
          - snapshot-every-12-hours
        default: snapshot-every-6-hours
      database_data_eviction:
        description: Data eviction policy.
        required: true
        type: choice
        options:
          - allkeys-lru
          - allkeys-lfu
          - allkeys-random
          - volatile-lru
          - volatile-lfu
          - volatile-random
          - volatile-ttl
          - noeviction
        default: allkeys-lru
      database_replication:
        description: Enable database replication.
        required: true
        type: boolean
        default: true
      database_enable_tls:
        description: Require TLS for database connections.
        required: true
        type: boolean
        default: true
      database_enable_default_user:
        description: Keep the Redis Cloud default user enabled.
        required: true
        type: boolean
        default: false
      database_source_ips_json:
        description: JSON array of source CIDRs, or null for Redis Cloud defaults.
        required: true
        type: string
        default: "null"
      database_alerts_json:
        description: JSON alert array, for example [{"name":"dataset-size","value":80}].
        required: true
        type: string
        default: "[]"
      database_remote_backup_json:
        description: JSON remote backup object, or null.
        required: true
        type: string
        default: "null"
      database_acl_rule_string:
        description: Redis ACL rule string for the generated service user.
        required: true
        type: string
        default: "+@all -@dangerous +info ~*"
      database_tags_json:
        description: JSON object of extra database tags.
        required: true
        type: string
        default: "{}"

permissions:
  contents: read
  id-token: write

concurrency:
  group: rediscloud-${{ inputs.operation }}-${{ inputs.subscription_name }}-${{ inputs.database_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  REDISCLOUD_ACCESS_KEY: ${{ secrets.REDISCLOUD_ACCESS_KEY }}
  REDISCLOUD_SECRET_KEY: ${{ secrets.REDISCLOUD_SECRET_KEY }}
  TF_STATE_BUCKET_NAME: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_REGION_NAME: ${{ secrets.TF_STATE_REGION }}

jobs:
  manage:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Terraform state
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.TF_STATE_REGION_NAME }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate workflow inputs
        env:
          OPERATION: ${{ inputs.operation }}
          SUBSCRIPTION_MODE: ${{ inputs.subscription_mode }}
          DESTROY_SCOPE: ${{ inputs.destroy_scope }}
          SUBSCRIPTION_PREFERRED_AZS_JSON: ${{ inputs.subscription_preferred_azs_json }}
          SUBSCRIPTION_MAINTENANCE_WINDOWS_JSON: ${{ inputs.subscription_maintenance_windows_json }}
          SUBSCRIPTION_TAGS_JSON: ${{ inputs.subscription_tags_json }}
          DATABASE_SOURCE_IPS_JSON: ${{ inputs.database_source_ips_json }}
          DATABASE_ALERTS_JSON: ${{ inputs.database_alerts_json }}
          DATABASE_REMOTE_BACKUP_JSON: ${{ inputs.database_remote_backup_json }}
          DATABASE_TAGS_JSON: ${{ inputs.database_tags_json }}
        run: |
          if [ "${OPERATION}" = "destroy" ] && [ "${DESTROY_SCOPE}" = "database-and-subscription" ] && [ "${SUBSCRIPTION_MODE}" = "existing-subscription" ]; then
            echo "database-and-subscription destroy requires subscription_mode=create-or-update-subscription."
            exit 1
          fi

          printf '%s' "${SUBSCRIPTION_PREFERRED_AZS_JSON}" | jq -e 'if type == "array" then . else error("subscription_preferred_azs_json must be a JSON array") end' >/dev/null
          printf '%s' "${SUBSCRIPTION_MAINTENANCE_WINDOWS_JSON}" | jq -e 'if . == null or type == "object" then . else error("subscription_maintenance_windows_json must be null or a JSON object") end' >/dev/null
          printf '%s' "${SUBSCRIPTION_TAGS_JSON}" | jq -e 'if type == "object" then . else error("subscription_tags_json must be a JSON object") end' >/dev/null
          printf '%s' "${DATABASE_SOURCE_IPS_JSON}" | jq -e 'if . == null or type == "array" then . else error("database_source_ips_json must be null or a JSON array") end' >/dev/null
          printf '%s' "${DATABASE_ALERTS_JSON}" | jq -e 'if type == "array" then . else error("database_alerts_json must be a JSON array") end' >/dev/null
          printf '%s' "${DATABASE_REMOTE_BACKUP_JSON}" | jq -e 'if . == null or type == "object" then . else error("database_remote_backup_json must be null or a JSON object") end' >/dev/null
          printf '%s' "${DATABASE_TAGS_JSON}" | jq -e 'if type == "object" then . else error("database_tags_json must be a JSON object") end' >/dev/null

      - name: Write subscription tfvars
        if: inputs.subscription_mode == 'create-or-update-subscription'
        env:
          SUBSCRIPTION_NAME: ${{ inputs.subscription_name }}
          SUBSCRIPTION_DATASET_SIZE_IN_GB: ${{ inputs.subscription_dataset_size_in_gb }}
          SUBSCRIPTION_THROUGHPUT_OPS_PER_SECOND: ${{ inputs.subscription_throughput_ops_per_second }}
          SUBSCRIPTION_REGION: ${{ inputs.subscription_region }}
          SUBSCRIPTION_NETWORKING_CIDR: ${{ inputs.subscription_networking_cidr }}
          SUBSCRIPTION_PUBLIC_ENDPOINT_ACCESS: ${{ inputs.subscription_public_endpoint_access }}
          SUBSCRIPTION_MULTI_AZ: ${{ inputs.subscription_multi_az }}
          SUBSCRIPTION_PREFERRED_AZS_JSON: ${{ inputs.subscription_preferred_azs_json }}
          SUBSCRIPTION_MAINTENANCE_WINDOWS_JSON: ${{ inputs.subscription_maintenance_windows_json }}
          SUBSCRIPTION_TAGS_JSON: ${{ inputs.subscription_tags_json }}
        run: |
          jq -n \
            --arg subscription_name "${SUBSCRIPTION_NAME}" \
            --arg region "${SUBSCRIPTION_REGION}" \
            --arg networking_deployment_cidr "${SUBSCRIPTION_NETWORKING_CIDR}" \
            --argjson dataset_size_in_gb "${SUBSCRIPTION_DATASET_SIZE_IN_GB}" \
            --argjson throughput_ops_per_second "${SUBSCRIPTION_THROUGHPUT_OPS_PER_SECOND}" \
            --argjson public_endpoint_access "${SUBSCRIPTION_PUBLIC_ENDPOINT_ACCESS}" \
            --argjson multiple_availability_zones "${SUBSCRIPTION_MULTI_AZ}" \
            --argjson preferred_availability_zones "${SUBSCRIPTION_PREFERRED_AZS_JSON}" \
            --argjson maintenance_windows "${SUBSCRIPTION_MAINTENANCE_WINDOWS_JSON}" \
            --argjson tags "${SUBSCRIPTION_TAGS_JSON}" \
            '{
              subscription_name: $subscription_name,
              dataset_size_in_gb: $dataset_size_in_gb,
              throughput_ops_per_second: $throughput_ops_per_second,
              region: $region,
              networking_deployment_cidr: $networking_deployment_cidr,
              public_endpoint_access: $public_endpoint_access,
              multiple_availability_zones: $multiple_availability_zones,
              preferred_availability_zones: $preferred_availability_zones,
              maintenance_windows: $maintenance_windows,
              tags: $tags
            }' > stacks/subscription/request.auto.tfvars.json

      - name: Write database tfvars
        env:
          SUBSCRIPTION_NAME: ${{ inputs.subscription_name }}
          DATABASE_NAME: ${{ inputs.database_name }}
          DATABASE_DATASET_SIZE_IN_GB: ${{ inputs.database_dataset_size_in_gb }}
          DATABASE_THROUGHPUT_OPS_PER_SECOND: ${{ inputs.database_throughput_ops_per_second }}
          DATABASE_REDIS_VERSION: ${{ inputs.database_redis_version }}
          DATABASE_PERSISTENCE_MODE: ${{ inputs.database_persistence_mode }}
          DATABASE_DATA_EVICTION: ${{ inputs.database_data_eviction }}
          DATABASE_REPLICATION: ${{ inputs.database_replication }}
          DATABASE_ENABLE_TLS: ${{ inputs.database_enable_tls }}
          DATABASE_ENABLE_DEFAULT_USER: ${{ inputs.database_enable_default_user }}
          DATABASE_SOURCE_IPS_JSON: ${{ inputs.database_source_ips_json }}
          DATABASE_ALERTS_JSON: ${{ inputs.database_alerts_json }}
          DATABASE_REMOTE_BACKUP_JSON: ${{ inputs.database_remote_backup_json }}
          DATABASE_ACL_RULE_STRING: ${{ inputs.database_acl_rule_string }}
          DATABASE_TAGS_JSON: ${{ inputs.database_tags_json }}
        run: |
          jq -n \
            --arg subscription_name "${SUBSCRIPTION_NAME}" \
            --arg database_name "${DATABASE_NAME}" \
            --arg redis_version "${DATABASE_REDIS_VERSION}" \
            --arg persistence_mode "${DATABASE_PERSISTENCE_MODE}" \
            --arg data_eviction "${DATABASE_DATA_EVICTION}" \
            --arg acl_rule_string "${DATABASE_ACL_RULE_STRING}" \
            --argjson dataset_size_in_gb "${DATABASE_DATASET_SIZE_IN_GB}" \
            --argjson throughput_ops_per_second "${DATABASE_THROUGHPUT_OPS_PER_SECOND}" \
            --argjson replication "${DATABASE_REPLICATION}" \
            --argjson enable_tls "${DATABASE_ENABLE_TLS}" \
            --argjson enable_default_user "${DATABASE_ENABLE_DEFAULT_USER}" \
            --argjson source_ips "${DATABASE_SOURCE_IPS_JSON}" \
            --argjson alerts "${DATABASE_ALERTS_JSON}" \
            --argjson remote_backup "${DATABASE_REMOTE_BACKUP_JSON}" \
            --argjson tags "${DATABASE_TAGS_JSON}" \
            '{
              subscription_name: $subscription_name,
              database_name: $database_name,
              dataset_size_in_gb: $dataset_size_in_gb,
              throughput_ops_per_second: $throughput_ops_per_second,
              redis_version: $redis_version,
              persistence_mode: $persistence_mode,
              data_eviction: $data_eviction,
              replication: $replication,
              enable_tls: $enable_tls,
              enable_default_user: $enable_default_user,
              source_ips: $source_ips,
              alerts: $alerts,
              remote_backup: $remote_backup,
              acl_rule_string: $acl_rule_string,
              tags: $tags
            }' > stacks/database/request.auto.tfvars.json

      - name: Prepare subscription backend
        if: inputs.subscription_mode == 'create-or-update-subscription'
        working-directory: stacks/subscription
        run: |
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {' \
            '    use_lockfile = true' \
            '  }' \
            '}' > backend.generated.tf

          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="region=${TF_STATE_REGION_NAME}" \
            -backend-config="key=subscriptions/${{ inputs.subscription_name }}.tfstate"

      - name: Prepare database backend
        working-directory: stacks/database
        run: |
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {' \
            '    use_lockfile = true' \
            '  }' \
            '}' > backend.generated.tf

          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="region=${TF_STATE_REGION_NAME}" \
            -backend-config="key=databases/${{ inputs.subscription_name }}/${{ inputs.database_name }}.tfstate"

      - name: Apply subscription
        if: inputs.operation == 'apply' && inputs.subscription_mode == 'create-or-update-subscription'
        working-directory: stacks/subscription
        run: terraform apply -input=false -auto-approve

      - name: Apply database
        if: inputs.operation == 'apply'
        working-directory: stacks/database
        run: terraform apply -input=false -auto-approve

      - name: Capture database outputs
        if: inputs.operation == 'apply'
        id: database_outputs
        working-directory: stacks/database
        run: |
          capture_output() {
            terraform output -raw "$1" 2>/dev/null || true
          }

          echo "database_id=$(capture_output database_id)" >> "$GITHUB_OUTPUT"
          echo "private_endpoint=$(capture_output private_endpoint)" >> "$GITHUB_OUTPUT"
          echo "public_endpoint=$(capture_output public_endpoint)" >> "$GITHUB_OUTPUT"
          echo "acl_user_name=$(capture_output acl_user_name)" >> "$GITHUB_OUTPUT"

      - name: Destroy database
        if: inputs.operation == 'destroy'
        working-directory: stacks/database
        run: terraform destroy -input=false -auto-approve

      - name: Destroy subscription
        if: inputs.operation == 'destroy' && inputs.destroy_scope == 'database-and-subscription'
        working-directory: stacks/subscription
        run: terraform destroy -input=false -auto-approve

      - name: Write summary
        run: |
          {
            echo "## Redis Cloud ${operation}"
            echo
            echo "- Operation: \`${operation}\`"
            echo "- Subscription mode: \`${subscription_mode}\`"
            echo "- Destroy scope: \`${destroy_scope}\`"
            echo "- Subscription: \`${subscription_name}\`"
            echo "- Database: \`${database_name}\`"
            if [ "${operation}" = "apply" ]; then
              echo "- Database ID: \`${database_id}\`"
              echo "- Private endpoint: \`${private_endpoint}\`"
              echo "- Public endpoint: \`${public_endpoint}\`"
              echo "- ACL user: \`${acl_user_name}\`"
              echo "- ACL password: sensitive Terraform output, not written to workflow summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          operation: ${{ inputs.operation }}
          subscription_mode: ${{ inputs.subscription_mode }}
          destroy_scope: ${{ inputs.destroy_scope }}
          subscription_name: ${{ inputs.subscription_name }}
          database_name: ${{ inputs.database_name }}
          database_id: ${{ steps.database_outputs.outputs.database_id }}
          private_endpoint: ${{ steps.database_outputs.outputs.private_endpoint }}
          public_endpoint: ${{ steps.database_outputs.outputs.public_endpoint }}
          acl_user_name: ${{ steps.database_outputs.outputs.acl_user_name }}
